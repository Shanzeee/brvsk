<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BRVSK logo</title>
  <desc id="desc">A geometric green B monogram next to the BRVSK wordmark.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="18" y1="10" x2="158" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172320"/>
      <stop offset="1" stop-color="#0C1212"/>
    </linearGradient>
    <linearGradient id="mark-line" x1="44" y1="34" x2="132" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4F5B4"/>
      <stop offset="1" stop-color="#82D96B"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="220" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="160" height="160" rx="38" fill="url(#mark-bg)"/>
    <rect x="10.75" y="10.75" width="158.5" height="158.5" rx="37.25" stroke="#30423D" stroke-width="1.5"/>
  </g>

  <path d="M51 43V137" stroke="url(#mark-line)" stroke-width="14" stroke-linecap="round"/>
  <path d="M52 46H94C114.435 46 131 59.8792 131 77C131 94.1208 114.435 108 94 108H52" stroke="url(#mark-line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 108H101C118.121 108 132 120.984 132 137" stroke="url(#mark-line)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="137" cy="42" r="6" fill="#A3E78D"/>

  <text x="208" y="117" fill="#EBF1ED" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="760" letter-spacing="-5">BRVSK</text>
  <circle cx="660" cy="112" r="8" fill="#A3E78D"/>
</svg>
